name: balaio-local

services:
  catalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-balaio_catalog}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-balaio_catalog_app}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
    ports:
      - "127.0.0.1:${CATALOG_DB_HOST_PORT:-5433}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql
      - ./db/init/01-create-catalog-db.sh:/docker-entrypoint-initdb.d/01-create-catalog-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$CATALOG_DB_PASSWORD\" psql -h 127.0.0.1 -U \"$$CATALOG_DB_USERNAME\" -d \"$$CATALOG_DB_NAME\" -qAt -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  catalog-service:
    image: balaio/catalog-service:local
    build:
      context: ../catalog-service
      dockerfile: Dockerfile
    environment:
      CATALOG_SERVICE_PORT: "8081"
      CATALOG_DB_URL: jdbc:postgresql://catalog-db:5432/${CATALOG_DB_NAME:-balaio_catalog}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-balaio_catalog_app}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
      PROFILE_SERVICE_URL: http://profile-service:8082
      JWT_PUBLIC_KEY_LOCATION: file:/run/keys/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-balaio-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-balaio-api}
      BALAIO_INTERNAL_TOKEN: ${BALAIO_INTERNAL_TOKEN:-}
    volumes:
      - ${JWT_PUBLIC_KEY_FILE:-./secrets/jwt-public.pem}:/run/keys/jwt-public.pem:ro
    ports:
      - "${CATALOG_HOST_PORT:-8081}:8081"
    depends_on:
      catalog-db:
        condition: service_healthy

  api-gateway:
    image: balaio/api-gateway:local
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_PORT: "8080"
      CATALOG_SERVICE_URL: http://catalog-service:8081
      PROFILE_SERVICE_URL: http://profile-service:8082
      COMMERCE_SERVICE_URL: http://commerce-service:8083
      COMMUNITY_SERVICE_URL: http://community-service:8084
      EVENTS_SERVICE_URL: http://events-service:8085
      JWT_PUBLIC_KEY_LOCATION: file:/run/keys/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-balaio-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-balaio-api}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:4321}
    volumes:
      - ${JWT_PUBLIC_KEY_FILE:-./secrets/jwt-public.pem}:/run/keys/jwt-public.pem:ro
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      catalog-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy

  frontend:
    image: balaio/frontend:local
    build:
      context: ../Balaio/Frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://127.0.0.1:3001/api/v1
    environment:
      API_URL: http://127.0.0.1:3001/api/v1
      FAKE_API_ENABLED: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-4321}:7879"

  profile-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: balaio_profile
      POSTGRES_USER: balaio_profile_app
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
    ports:
      - "127.0.0.1:${PROFILE_DB_HOST_PORT:-5434}:5432"
    volumes:
      - profile-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -qAt -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  profile-service:
    image: balaio/profile-service:local
    build:
      context: ../profile-service
      dockerfile: Dockerfile
    env_file:
      - ./secrets/admin.env
    environment:
      PROFILE_SERVICE_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://profile-db:5432/balaio_profile
      SPRING_DATASOURCE_USERNAME: balaio_profile_app
      SPRING_DATASOURCE_PASSWORD: ${PROFILE_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
      PROFILE_FRONTEND_BASE_URL: ${PROFILE_FRONTEND_BASE_URL:-http://localhost:4321}
      PROFILE_RECOVERY_TOKEN_TTL: ${PROFILE_RECOVERY_TOKEN_TTL:-PT1H}
      PROFILE_SMTP_HOST: ${PROFILE_SMTP_HOST:-localhost}
      PROFILE_SMTP_PORT: ${PROFILE_SMTP_PORT:-1025}
      PROFILE_SMTP_USERNAME: ${PROFILE_SMTP_USERNAME:-}
      PROFILE_SMTP_PASSWORD: ${PROFILE_SMTP_PASSWORD:-}
      PROFILE_SMTP_AUTH: ${PROFILE_SMTP_AUTH:-false}
      PROFILE_SMTP_STARTTLS: ${PROFILE_SMTP_STARTTLS:-false}
      PROFILE_MAIL_FROM: ${PROFILE_MAIL_FROM:-nao-responda@localhost}
      JWT_PRIVATE_KEY_LOCATION: file:/run/keys/jwt-private.pem
      JWT_ISSUER: ${JWT_ISSUER:-balaio-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-balaio-api}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:4321}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    volumes:
      - ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt-private.pem}:/run/keys/jwt-private.pem:ro
    ports:
      - "${PROFILE_HOST_PORT:-8082}:8082"
    depends_on:
      profile-db:
        condition: service_healthy

  commerce-db:
    profiles: [extended]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: balaio_commerce
      POSTGRES_USER: balaio_commerce_app
      POSTGRES_PASSWORD: ${COMMERCE_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
    ports:
      - "127.0.0.1:${COMMERCE_DB_HOST_PORT:-5435}:5432"
    volumes:
      - commerce-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -qAt -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  commerce-service:
    profiles: [extended]
    image: balaio/commerce-service:local
    build:
      context: ../commerce-service
      dockerfile: Dockerfile
    environment:
      COMMERCE_SERVICE_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://commerce-db:5432/balaio_commerce
      SPRING_DATASOURCE_USERNAME: balaio_commerce_app
      SPRING_DATASOURCE_PASSWORD: ${COMMERCE_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
      BALAIO_INTERNAL_TOKEN: ${BALAIO_INTERNAL_TOKEN:-}
      CATALOG_SERVICE_URL: http://catalog-service:8081
      JWT_PUBLIC_KEY_LOCATION: file:/run/keys/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-balaio-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-balaio-api}
    volumes:
      - ${JWT_PUBLIC_KEY_FILE:-./secrets/jwt-public.pem}:/run/keys/jwt-public.pem:ro
    ports:
      - "${COMMERCE_HOST_PORT:-8083}:8083"
    depends_on:
      commerce-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

  community-db:
    profiles: [extended]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: balaio_community
      POSTGRES_USER: balaio_community_app
      POSTGRES_PASSWORD: ${COMMUNITY_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
    ports:
      - "127.0.0.1:${COMMUNITY_DB_HOST_PORT:-5436}:5432"
    volumes:
      - community-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -qAt -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  community-service:
    profiles: [extended]
    image: balaio/community-service:local
    build:
      context: ../community-service
      dockerfile: Dockerfile
    environment:
      COMMUNITY_SERVICE_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://community-db:5432/balaio_community
      SPRING_DATASOURCE_USERNAME: balaio_community_app
      SPRING_DATASOURCE_PASSWORD: ${COMMUNITY_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
      BALAIO_INTERNAL_TOKEN: ${BALAIO_INTERNAL_TOKEN:-}
      COMMERCE_SERVICE_URL: http://commerce-service:8083
      JWT_PUBLIC_KEY_LOCATION: file:/run/keys/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-balaio-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-balaio-api}
    volumes:
      - ${JWT_PUBLIC_KEY_FILE:-./secrets/jwt-public.pem}:/run/keys/jwt-public.pem:ro
    ports:
      - "${COMMUNITY_HOST_PORT:-8084}:8084"
    depends_on:
      community-db:
        condition: service_healthy
      commerce-service:
        condition: service_healthy

  events-db:
    profiles: [extended]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: balaio_events
      POSTGRES_USER: balaio_events_app
      POSTGRES_PASSWORD: ${EVENTS_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
    ports:
      - "127.0.0.1:${EVENTS_DB_HOST_PORT:-5437}:5432"
    volumes:
      - events-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -qAt -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  events-service:
    profiles: [extended]
    image: balaio/events-service:local
    build:
      context: ../events-service
      dockerfile: Dockerfile
    environment:
      EVENTS_SERVICE_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:postgresql://events-db:5432/balaio_events
      SPRING_DATASOURCE_USERNAME: balaio_events_app
      SPRING_DATASOURCE_PASSWORD: ${EVENTS_DB_PASSWORD:-${DB_PASSWORD:?Defina DB_PASSWORD em platform/.env}}
    ports:
      - "${EVENTS_HOST_PORT:-8085}:8085"
    depends_on:
      events-db:
        condition: service_healthy

volumes:
  catalog-db-data:
  profile-db-data:
  commerce-db-data:
  community-db-data:
  events-db-data:
